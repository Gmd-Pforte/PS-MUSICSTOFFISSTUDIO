<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b0d14">
  <title>PS AI MUSIC – Song Prompter V6</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">PS AI MUSIC</p>
        <h1>Song Prompter V6</h1>
        <p class="subtitle">Modularer Suno-v6-Baukasten für Genres, Stimmen, Instrumente, Songaufbau und Produktion.</p>
        <p id="catalogStats" class="catalog-stats"></p>
      </div>
      <div class="top-actions">
        <button id="randomizeBtn" class="btn ghost">🎲 Smart Variation</button>
        <button id="resetBtn" class="btn ghost">↺ Reset</button>
      </div>
    </header>

    <section id="utilityControls" class="utility-grid"></section>

    <section class="workspace">
      <div class="builder" id="builder"></div>

      <aside class="preview-card">
        <div class="preview-head">
          <div>
            <span class="label">Live Prompt</span>
            <strong id="counter">0 / 1000</strong>
          </div>
          <span id="statusBadge" class="badge ok">V6 OK</span>
        </div>

        <textarea id="promptOutput" spellcheck="false" aria-label="Fertiger Suno Prompt"></textarea>

        <div id="warnings" class="warnings" aria-live="polite"></div>

        <div class="actions">
          <button id="copyBtn" class="btn primary">📋 Kopieren</button>
          <button id="optimizeBtn" class="btn">✨ V6 optimieren</button>
          <button id="savePresetBtn" class="btn">💾 Preset speichern</button>
        </div>

        <div class="preset-row">
          <label for="presetSelect">Master-Preset</label>
          <select id="presetSelect"></select>
          <button id="loadPresetBtn" class="btn small">Laden</button>
        </div>

        <p class="preview-note">Der Optimierer schützt wichtige Stil-, Stimm- und Wunschangaben und entfernt bei Bedarf zuerst niedrig priorisierte Details.</p>
      </aside>
    </section>
  </main>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
