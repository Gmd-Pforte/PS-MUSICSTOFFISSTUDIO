plugins {
    id 'com.android.application'
}

android {
    namespace 'com.psaimusic.songprompter'
    compileSdk 35

    defaultConfig {
        applicationId 'com.psaimusic.songprompter'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets {
        main {
            assets.srcDir "$buildDir/generated/assets/site"
        }
    }
}

def syncSite = tasks.register('syncSite', Copy) {
    from(rootProject.projectDir) {
        include 'index.html', 'styles.css', 'data.js', 'app.js'
    }
    into "$buildDir/generated/assets/site"
}

tasks.named('preBuild').configure {
    dependsOn syncSite
}
