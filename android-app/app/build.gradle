plugins {
    id 'com.android.application'
}

android {
    namespace 'com.psaimusic.stoffisstudio'
    compileSdk 35

    defaultConfig {
        applicationId 'com.psaimusic.stoffisstudio'
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName '0.8.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

def repoRoot = rootProject.projectDir.parentFile
def generatedAssets = layout.buildDirectory.dir('generated/stoffisAssets')

tasks.register('prepareStoffisWebAssets', Copy) {
    into(generatedAssets)
    from(repoRoot) {
        include 'index.html'
        include 'styles.css'
        include 'character-01.json'
        into 'www'
    }
    from(new File(repoRoot, 'src')) {
        include '**/*.js'
        into 'www/src'
    }
    from(new File(repoRoot, 'assets')) {
        include '**/*'
        into 'www/assets'
    }
}

android.sourceSets.main.assets.srcDir(generatedAssets)
tasks.named('preBuild').configure { dependsOn 'prepareStoffisWebAssets' }
