name: Build Stoffis Studio APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'styles.css'
      - 'character-01.json'
      - 'src/**'
      - 'android-app/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p android-app :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk PS-MUSIC-STOFFIS-STUDIO-v0.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PS-MUSIC-STOFFIS-STUDIO-APK
          path: PS-MUSIC-STOFFIS-STUDIO-v0.1.apk
          if-no-files-found: error
          retention-days: 30
